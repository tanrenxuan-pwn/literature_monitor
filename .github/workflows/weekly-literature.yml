name: Weekly Literature Monitor


on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Run mode"
        required: true
        default: "probe"
        type: choice
        options:
          - preflight
          - probe
          - dry-run
          - live

  schedule:
    # 每周一北京时间 08:00
    # UTC 00:00
    - cron: "0 0 * * 1"


permissions:
  contents: write


jobs:

  literature-monitor:

    runs-on: self-hosted


    env:
      PYTHONUNBUFFERED: 1
      PIP_DISABLE_PIP_VERSION_CHECK: 1

      SOURCES: openalex,semantic_scholar,arxiv,ieee

      RUN_MODE: ${{ github.event.inputs.run_mode || 'live' }}



    steps:


    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0



    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"



    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt



    - name: Validate retrieval invariants
      run: |
        python scripts/validate_retrieval.py



    - name: Run selected retrieval mode
      run: |
        python scripts/run_incremental.py \
          --mode "${RUN_MODE}"



    - name: Generate weekly report
      if: success()
      run: |
        python scripts/generate_weekly_report.py



    - name: Send email notification
      if: success()
      env:
        SMTP_HOST: smtp.qq.com
        SMTP_PORT: 465
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        MAIL_TO: ${{ secrets.MAIL_TO }}

      run: |
        python scripts/send_email.py



    - name: Commit incremental state and outputs
      if: success() && env.RUN_MODE == 'live'
      run: |

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


        git add \
          data/state \
          data/normalized \
          exports \
          reports



        if git diff --cached --quiet
        then
          echo "No changes."
        else

          git commit -m "weekly literature update [skip ci]"

          git push origin HEAD:${GITHUB_REF_NAME}

        fi



    - name: Upload artifacts

      if: always()

      uses: actions/upload-artifact@v4

      with:

        name: weekly-literature-output

        path: |

          exports

          reports
