name: Weekly Literature Monitor

on:
  # GitHub cron uses UTC: Monday 00:23 UTC = Monday 08:23 Asia/Shanghai.
  schedule:
    - cron: '23 0 * * 1'
    # Tuesday is a recovery pass only when Monday did not commit a result.
    - cron: '23 0 * * 2'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode for a manual test or live update'
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - probe
          - dry-run
          - email-test
          - live

permissions:
  contents: write

concurrency:
  group: literature-monitor-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  SOURCES: openalex,semantic_scholar,arxiv,ieee
  RUN_MODE: ${{ github.event.inputs.mode || 'live' }}
  RUN_ID: weekly-${{ github.run_id }}

jobs:
  search:
    runs-on: self-hosted
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Decide whether scheduled recovery is needed
        id: recovery_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: >-
          python scripts/weekly_recovery_gate.py
          --event-name "${EVENT_NAME}"
          --event-schedule "${EVENT_SCHEDULE}"
          --github-output "${GITHUB_OUTPUT}"

      - name: Install dependencies
        if: ${{ steps.recovery_gate.outputs.should_run == 'true' }}
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate retrieval invariants
        if: ${{ steps.recovery_gate.outputs.should_run == 'true' }}
        run: python scripts/validate_retrieval.py --self-test

      - name: Run selected retrieval mode
        if: ${{ steps.recovery_gate.outputs.should_run == 'true' }}
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_POLITE_EMAIL: ${{ secrets.OPENALEX_POLITE_EMAIL }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          IEEE_API_KEY: ${{ secrets.IEEE_API_KEY }}
          WEEKLY_START_DATE: ${{ steps.recovery_gate.outputs.start }}
          WEEKLY_END_DATE: ${{ steps.recovery_gate.outputs.end }}
        run: |
          set -Eeuo pipefail

          case "${RUN_MODE}" in
            preflight)
              python scripts/run_incremental.py \
                --sources "${SOURCES}" \
                --preflight-only
              ;;
            probe)
              python scripts/run_incremental.py \
                --sources "${SOURCES}" \
                --live-probe-only
              ;;
            dry-run)
              python scripts/run_incremental.py \
                --sources "${SOURCES}" \
                --dry-run \
                --run-id "${RUN_ID}"
              validation_dir="data/validation/${RUN_ID}"
              new_csv="$(find "${validation_dir}" -maxdepth 1 -type f -name 'new_candidates_*.csv' -print -quit)"
              if [[ -z "${new_csv}" ]]; then
                echo 'No dry-run candidate CSV was produced.' >&2
                exit 1
              fi
              python scripts/export_ris.py \
                --input "${new_csv}" \
                --output "${validation_dir}/new_candidates.ris"
              ;;
            email-test)
              echo 'Email test uses existing exports and does not query providers.'
              ;;
            live)
              window_args=()
              if [[ -n "${WEEKLY_START_DATE}" && -n "${WEEKLY_END_DATE}" ]]; then
                window_args+=(--start-date "${WEEKLY_START_DATE}" --end-date "${WEEKLY_END_DATE}")
              fi
              python scripts/run_incremental.py \
                --sources "${SOURCES}" \
                --run-id "${RUN_ID}" \
                "${window_args[@]}"
              python scripts/export_ris.py \
                --input exports/latest_new.csv \
                --output exports/latest_new.ris
              ;;
            *)
              echo "Unsupported RUN_MODE: ${RUN_MODE}" >&2
              exit 2
              ;;
          esac

      - name: Commit incremental state and outputs
        if: ${{ success() && steps.recovery_gate.outputs.should_run == 'true' && env.RUN_MODE == 'live' }}
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Keep the large historical backfill checkpoint/OAI cache out of the
          # weekly repository commit. Incremental runs need only these paths.
          git add -f -- \
            data/state/seen_keys.txt \
            "data/state/runs/${RUN_ID}.json" \
            data/normalized \
            exports/latest_new.csv \
            exports/latest_new.ris

          if git diff --cached --name-only | grep -Eq '(^|/)backfill_checkpoints/|arxiv_oai_cache'; then
            echo 'A backfill checkpoint or OAI cache was staged unexpectedly.' >&2
            exit 1
          fi

          if git diff --cached --quiet; then
            echo 'No state or output changes to commit.'
          else
            git diff --cached --stat
            git commit -m 'weekly literature update [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Send weekly email report
        if: ${{ success() && steps.recovery_gate.outputs.should_run == 'true' && (env.RUN_MODE == 'live' || env.RUN_MODE == 'email-test') }}
        # A live retrieval remains successful if SMTP is temporarily unavailable.
        # The dedicated email test still fails visibly when its delivery fails.
        continue-on-error: ${{ env.RUN_MODE == 'live' }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          RUN_ID: ${{ env.RUN_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/send_weekly_email.py

      - name: Upload run artifacts
        if: ${{ always() && steps.recovery_gate.outputs.should_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: literature-monitor-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            exports/latest_new.csv
            exports/latest_new.ris
            data/state/runs/${{ env.RUN_ID }}.json
            data/normalized/*${{ env.RUN_ID }}.csv
            data/validation/${{ env.RUN_ID }}/
